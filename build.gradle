plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

// The jar carries the Minecraft version it was built against, matching
// LegendQuest itself: this pack now ships one jar per supported version and
// three files called examplepack-1.0.0.jar would be indistinguishable.
version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // The whole trick: compile against the LegendQuest jar. In a published
    // world this would be a maven coordinate; for the example it is whatever
    // sits in libs/ — matched by pattern rather than by name, so each version
    // branch just holds the LegendQuest jar built for ITS Minecraft version
    // and this line never needs editing. Copy one from
    // LegendQuest-ReForged/build/libs after building the matching branch.
    implementation fileTree(dir: 'libs', include: ['legendquest-*.jar'])
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
