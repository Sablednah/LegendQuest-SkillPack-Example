plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

// The jar carries the Minecraft version it was built against, matching
// LegendQuest itself: this pack now ships one jar per supported version and
// three files called examplepack-1.0.0.jar would be indistinguishable.
version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // The whole trick: compile against the LegendQuest jar. In a published
    // world this would be a maven coordinate.
    //
    // Matched on THIS branch's minecraft_version, from two places. libs/ is
    // for anyone who downloaded this example on its own; the sibling checkout
    // is for working on both at once.
    //
    // Version-matched rather than "whatever jar is in libs/", because
    // libs/*.jar is gitignored: an untracked file does not follow a branch
    // switch, so a plain wildcard silently compiles the 1.21.11 branch against
    // whichever jar the last build happened to leave behind. It fails loudly
    // now if the right one is missing, which is the better failure.
    implementation fileTree(dir: 'libs',
            include: ["legendquest-*+mc${minecraft_version}.jar"])
    implementation fileTree(dir: '../LegendQuest-ReForged/build/libs',
            include: ["legendquest-*+mc${minecraft_version}.jar"])
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
